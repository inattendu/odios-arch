---
# odios_role_pre_scaffold: true on installs predating the timers/sockets wants
# dirs (common 2026.5.0b1).
- name: Resolve prior role version
  ansible.builtin.include_tasks: "../../../tasks/resolve_prior_version.yml"
  vars:
    scaffold_version: '2026.5.0b1'

# [odios] : dépôt pacman local (miroir Arch d'apt.odio.love) servant nos paquets
# maison + AUR. Enregistré dans pacman.conf s'il manque. SigLevel TrustAll car
# le dépôt local n'est pas signé.
- name: Ensure odios pacman repo is registered
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - odios repo"
    block: |
      [odios]
      SigLevel = Optional TrustAll
      Server = {{ odios_repo_url }}
  become: true

# Un seul refresh pour tout le run (les rôles suivants ne refont pas de -Sy).
- name: Update pacman cache
  community.general.pacman:
    update_cache: true
  become: true

- name: User systemd directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  become: "{{ become_for_target_user }}"
  loop:
    - "/home/{{ target_user }}/.config/systemd/user"
    - "/home/{{ target_user }}/.config/systemd/user/default.target.wants"
    - "/home/{{ target_user }}/.config/systemd/user/sockets.target.wants"
    - "/home/{{ target_user }}/.config/systemd/user/timers.target.wants"
  when: odios_role_pre_scaffold | bool

- name: First-install scaffolding
  when: ansible_role_name not in odios_prior_roles
  block:
    # Needed by become_user when invoker, root and target_user are three identities.
    - name: Install acl (needed by become_user)
      community.general.pacman:
        name: acl
        state: present
      become: true
      when: target_user != ansible_user_id

    # odioctl is also created by the odioctl package's postinst, but that runs
    # in the upgrade role, after linger has started the user manager. Creating
    # it here means a freshly created target_user's manager comes up already
    # holding it, so the sudoers fragment applies without a re-login.
    - name: Ensure required groups exist
      ansible.builtin.group:
        name: "{{ item }}"
        state: present
      become: true
      loop:
        - audio
        - input
        - plugdev
        - odio
        - odioctl

    # `odio` carries state.json access; `odioctl` is what the package's sudoers
    # fragment grants root to. Only target_user gets that one.
    - name: Ensure user in audio group
      ansible.builtin.user:
        name: "{{ target_user }}"
        append: true
        groups:
          - audio
          - users
          - input
          - odio
          - odioctl
          - plugdev
          - systemd-journal
      become: true

    # So the invoker can read /var/lib/odio/state.json from its own login.
    - name: Ensure invoking user (live, ≠ target_user) in odio group
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        append: true
        groups: [odio]
      become: true
      when:
        - install_mode == "live"
        - ansible_user_id != target_user
        - ansible_user_id != "root"

    - name: Check linger status
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ target_user }}"
      register: common_linger_stat

    - name: Enable user session persistence (linger) - live
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ target_user }}"
      become: true
      changed_when: true
      when:
        - not common_linger_stat.stat.exists
        - install_mode == "live"

    - name: Ensure linger directory exists - image build
      ansible.builtin.file:
        path: /var/lib/systemd/linger
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true
      when:
        - not common_linger_stat.stat.exists
        - install_mode == "image"

    - name: Enable user session persistence (linger) - image build
      ansible.builtin.file:
        path: "/var/lib/systemd/linger/{{ target_user }}"
        state: touch
        mode: '0644'
        modification_time: preserve
        access_time: preserve
      become: true
      when:
        - not common_linger_stat.stat.exists
        - install_mode == "image"

    - name: Setup polkit
      ansible.builtin.include_tasks: polkit.yml
