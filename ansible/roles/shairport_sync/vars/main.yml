---
shairport_sync_version: "2026.10.0b2"
shairport_sync_label: "AirPlay"
shairport_sync_description: "Play from Apple devices"
shairport_sync_group: "Streaming"
shairport_sync_services:
  - shairport-sync.service

# Le build Arch de shairport-sync inclut les backends natifs (alsa, pipewire,
# pulseaudio, jack) — on pilote donc PipeWire directement par son backend natif.
shairport_sync_audioserver_backend:
  pulseaudio: "pulseaudio"
  pipewire: "pipewire"
