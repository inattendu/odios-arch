---
- name: Web radio plugins (first activation)
  when: "'upnpwebradios' not in odios_prior_features"
  block:
    - name: Install python-pip
      community.general.pacman:
        name: python-pip
        state: present
      become: true

    - name: Install pyradios python package
      ansible.builtin.pip:
        break_system_packages: true
        name: pyradios
      become: "{{ become_for_target_user }}"
      become_user: "{{ target_user }}"
    # Les plugins web radio (radios, radio-browser, radio-paradise,
    # mother-earth-radio) sont fournis par le paquet upmpdcli sur Arch ; seule
    # la lib python pyradios doit être installée (ci-dessus via pip).

    - name: Configure upmpdcli web radio plugins
      ansible.builtin.lineinfile:
        path: "/home/{{ target_user }}/.config/upmpdcli/upmpdcli.conf"
        regexp: "^#?{{ item.key }}\\s*="
        line: "{{ item.key }} = {{ item.value }}"
      become: "{{ become_for_target_user }}"
      become_user: "{{ target_user }}"
      loop:
        - { key: "upradiosuser", value: "bugsbunny" }
        - { key: "upradiostitle", value: "Upmpdcli Radio List" }
        - { key: "radio-browseruser", value: "bugsbunny" }
        - { key: "radio-browsertitle", value: "Radio Browser" }
        - { key: "radio-paradiseuser", value: "bugsbunny" }
        - { key: "radio-paradisetitle", value: "Radio Paradise" }
        - { key: "mother-earth-radiouser", value: "bugsbunny" }
        - { key: "mother-earth-radiotitle", value: "Mother Earth Radio" }
      notify: Restart upmpdcli
