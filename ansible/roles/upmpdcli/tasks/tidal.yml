---
- name: Tidal plugin (first activation)
  when: "'tidal' not in odios_prior_features"
  block:
    - name: Install python-pip
      community.general.pacman:
        name: python-pip
        state: present
      become: true

    - name: Install tidalapi python package
      ansible.builtin.pip:
        break_system_packages: true
        name: tidalapi
      become: "{{ become_for_target_user }}"
      become_user: "{{ target_user }}"
    # Le plugin Tidal est fourni par le paquet upmpdcli ; seule la lib python
    # tidalapi doit être installée (ci-dessus via pip).

- name: Configure tidal user
  ansible.builtin.lineinfile:
    path: "/home/{{ target_user }}/.config/upmpdcli/upmpdcli.conf"
    regexp: '^#?tidaluser\s*='
    line: "tidaluser = bugsbunny"
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  notify: Restart upmpdcli
