---
# Le plugin Qobuz est fourni par le paquet upmpdcli sur Arch
# (/usr/share/upmpdcli/cdplugins/qobuz) — pas de paquet séparé à installer.
- name: Configure qobuz user
  ansible.builtin.lineinfile:
    path: "/home/{{ target_user }}/.config/upmpdcli/upmpdcli.conf"
    regexp: '^#?qobuzuser\s*='
    line: "qobuzuser = bugsbunny"
  become: "{{ become_for_target_user }}"
  become_user: "{{ target_user }}"
  notify: Restart upmpdcli
