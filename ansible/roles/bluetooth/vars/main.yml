---
bluetooth_version: "2026.10.0b1"
bluetooth_label: "Bluetooth"
bluetooth_description: "Bluetooth audio, in and out"
bluetooth_group: "Audio"
# <role>_services are user units; bluetooth.service is the system's.
bluetooth_system_services:
  - bluetooth.service

# A2DP codec support (listes concaténées à bluez/bluez-utils). PulseAudio a
# besoin du module BT ; PipeWire gère le Bluetooth nativement (SPA intégré au
# paquet pipewire), donc aucun paquet supplémentaire.
bluetooth_audioserver_package:
  pulseaudio:
    - pulseaudio-bluetooth
  pipewire: []
